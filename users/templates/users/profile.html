
<form method="post">
    {% csrf_token %}
    <div>
        <label for="last_name">Nom </label>
        <input type="text" name="last_name" id="last_name"  value="{{ user.last_name }}" placeholder="nom de famille" required>
    </div>
    <div>
        <label for="first_name">Prenom </label>
        <input type="text" name="first_name" id="first_name" value="{{ user.first_name }}" placeholder="Prénom" required>
    </div>
     <div>
        <label for="username">Nom d'utilisateur</label>
        <input type="text" name="username" id="username" value="{{ user.username }}" placeholder="nom d'utilisateur" disabled>
    </div>
    <button type="submit">enregistrer</button>
</form>
