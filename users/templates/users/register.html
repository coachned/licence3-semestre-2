
{% if error  %}
<div>
<p> {{ error }} </p>
</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div>
        <label for="last_name">Nom </label>
        <input type="text" name="last_name" id="last_name" placeholder="nom de famille" required>
    </div>
    <div>
        <label for="first_name">Prenom </label>
        <input type="text" name="first_name" id="first_name" placeholder="Prénom" required>
    </div>
    <div>
        <label for="email">email </label>
        <input type="email" name="email" id="email" placeholder="Entrez votre mail" required>
    </div>
     <div>
        <label for="username">Nom d'utilisateur</label>
        <input type="text" name="username" id="username" placeholder="nom d'utilisateur" required>
    </div>
     <div>
        <label for="password">Mot de passe</label>
        <input type="password" name="password" id="password" placeholder="Mot de passe" required>
    </div>
    <button type="submit">Créer un compte</button>
    <p>Avez vous déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</form>
